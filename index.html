<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico">
    <title>eLab Safety Escape Rooms</title>
    <style>
        :root {
            --box-gap-horizontal: 50px;
            --box-gap-vertical: 50px;
            --title-to-boxes-gap: 150px;
            --boxes-to-logos-gap: 100px;
            --logo-gap-horizontal: 40px;
            --logo-gap-vertical: 20px;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .title {
            margin: 40px 20px 0;
            padding: 16px 40px;
            background: white;
            color: #222;
            font-size: 2.2rem;
            font-weight: 700;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 90%;
        }

            .title span.green {
                color: #78d255;
            }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: var(--box-gap-horizontal);
            padding: 20px;
            max-width: 100%;
            margin-top: var(--title-to-boxes-gap);
        }

        @media (max-width: 768px) {
            .container {
                gap: var(--box-gap-vertical);
            }
        }

        .box {
            position: relative;
            width: 480px;
            height: 320px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            flex: 0 0 auto;
        }

            .box:hover {
                transform: scale(1.08);
                box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            }

            .box img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .box .label {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                padding: 20px;
                background: linear-gradient(transparent, rgba(0,0,0,0.6));
                color: white;
                font-size: 1.6rem;
                font-weight: 600;
                text-align: center;
                text-shadow: 0 2px 10px rgba(0,0,0,0.8);
                pointer-events: none;
            }

        @media (max-width: 500px) {
            .box {
                width: 300px;
                height: 200px;
            }

                .box .label {
                    font-size: 1.2rem;
                    padding: 15px;
                }

            .title {
                font-size: 1.2rem;
                padding: 14px 30px;
            }
        }

        #custom-logos {
            display: flex;
            flex-wrap: wrap; /* allows wrapping */
            justify-content: center; /* always perfectly centered */
            align-items: center;
            gap: var(--logo-gap-horizontal);
            margin-top: var(--boxes-to-logos-gap);
            padding: 20px;
        }

            #custom-logos img {
                height: 50px;
                max-width: 200px; /* prevent huge logos from breaking layout */
                object-fit: contain;
            }

                #custom-logos img[src="./assets/images/logo_sbs.png"] {
                    height: 80px;
                }
    </style>
</head>
<body>

    <div class="title"><span class="green">e</span>Lab Safety Escape Rooms</div>

    <div class="container">
        <a href="./rooms/elabsafety_chem/index.html" class="box">
            <img src="./assets/images/thumbnail_chem_lab.png" alt="ChemLab">
            <div class="label">Chemistry Lab</div>
        </a>
        <a href="./rooms/elabsafety_bio/index.html" class="box">
            <img src="./assets/images/thumbnail_bio_lab_v3.png" alt="BioLab">
            <div class="label">Biological Research Lab</div>
        </a>
    </div>
    <div id="custom-logos">
        <img src="./assets/images/logo_cuhk.png" alt="Logo CUHK">
        <img src="./assets/images/logo_medicine_horizontal.png" alt="Logo CUHK Med">
        <img src="./assets/images/logo_sbs.png" alt="Logo SBS">
        <img src="./assets/images/logo_elite.png" alt="Logo ELITE">
        <img src="./assets/images/VLE_Logo_v1_text.png" alt="Logo VLE">
    </div>

</body>
</html>
